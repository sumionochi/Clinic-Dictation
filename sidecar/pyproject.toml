[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinic-sidecar"
version = "0.1.0"
description = "Local Python service for Clinic Dictation: speech recognition, agents and FHIR export"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Aaditya Srivastava" }]
dependencies = [
    "fastapi>=0.162.0",
    "mlx-audio>=0.6.3",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
